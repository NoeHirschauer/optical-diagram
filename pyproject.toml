[project]
name = "optical_diagram"
authors = [
    { name = "Noé Hirschauer", email = "noe.hirschauer@universite-paris-saclay.fr" },
]
description = "Draw optical diagrams using matplotlib."
version = "0.5.1"
readme = "README.md"
license = { file = "LICENSE" }
urls = { "Repository" = "https://github.com/NoeHirschauer/optical-diagram" }
requires-python = ">=3.12,<3.15"
dependencies = [
    "matplotlib>=3",
    "numpy>=2",
]

[dependency-groups]
dev = [
    { include-group = "tests" },
]
doc = [
    "sphinx>=9.0",
    "pydata-sphinx-theme>=0.15",
    "sphinx_gallery>=0.20",
    "sphinx-autoapi>=3.9.0",
]
tests = [
    "pytest>=7.0",
]

[project.scripts]
doc = "_doc:main"

[build-system]
requires      = ["uv_build>=0.11.10,<0.14.0"]
build-backend = "uv_build"


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths  = ["tests"]
addopts    = ["--import-mode=importlib"]
